<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error {{ code }} — Smart Campus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="text-center p-5">
    <div style="font-size:5rem;font-weight:900;color:#1E3A5F;line-height:1;">{{ code }}</div>
    <div class="fs-4 fw-semibold mb-2 mt-2">
      {% if code == 403 %}Access Denied
      {% elif code == 404 %}Page Not Found
      {% else %}Server Error{% endif %}
    </div>
    <p class="text-muted mb-4">{{ msg }}</p>
    <a href="/" class="btn btn-primary px-4">
      <i class="bi bi-house me-1"></i>Back to Home
    </a>
  </div>
</body>
</html>
